plugins {
    id "com.android.application"
}

android {
    namespace "de.ablinger.semesterboard"
    compileSdk 34

    defaultConfig {
        applicationId "de.ablinger.semesterboard"
        minSdk 26
        targetSdk 34
        // Wird vom Build-Workflow hochgezählt, damit neue APKs die alte ersetzen.
        versionCode (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName "1." + (System.getenv("VERSION_CODE") ?: "0")
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "semesterboard"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
